<svg xmlns="http://www.w3.org/2000/svg" width="864" height="483" viewBox="0 0 864 483" role="img" aria-labelledby="title desc">
  <title id="title">Пример окна Наблюдателя VPN</title>
  <desc id="desc">Подключён пример профиля Рабочий VPN. Наблюдение включено. Настроены проверка каждые две секунды и ожидание подключения до ста двадцати секунд.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#e9f2ff"/><stop offset="1" stop-color="#f4f7fc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173358" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="864" height="483" rx="18" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="35" width="736" height="398" rx="13" fill="#fff" stroke="#cad8e9" filter="url(#shadow)"/>
    <path d="M64 48a13 13 0 0 1 13-13h710a13 13 0 0 1 13 13v22H64Z" fill="#f2f5fa"/>
    <text x="84" y="57" font-size="13" fill="#445675">VpnWatch · пример окна</text>
    <path d="M718 54h12m17-5h10v10h-10zm26 0 10 10m0-10-10 10" fill="none" stroke="#647794" stroke-width="1.3"/>
    <text x="92" y="112" font-size="28" font-weight="700" fill="#172a46">Наблюдатель VPN</text>
    <text x="92" y="151" font-size="14" fill="#263851">VPN-профиль</text>
    <rect x="202" y="131" width="449" height="29" rx="5" fill="#fff" stroke="#becce0"/>
    <text x="215" y="151" font-size="14" fill="#172a46">Рабочий VPN</text>
    <path d="m629 143 5 5 5-5" fill="none" stroke="#526581" stroke-width="1.4"/>
    <rect x="663" y="131" width="109" height="29" rx="5" fill="#f7f9fd" stroke="#becce0"/>
    <text x="717" y="150" font-size="13" fill="#263851" text-anchor="middle">Обновить</text>
    <rect x="92" y="172" width="680" height="63" rx="6" fill="#eef5ff"/>
    <circle cx="110" cy="194" r="4.5" fill="#168451"/>
    <text x="124" y="199" font-size="15" font-weight="700" fill="#175942">Подключён · Наблюдение включено</text>
    <text x="106" y="221" font-size="13" fill="#3b5476">После обрыва приложение переподключит этот профиль.</text>
    <rect x="92" y="248" width="680" height="101" rx="6" fill="#fff" stroke="#d2dceb"/>
    <rect x="104" y="241" width="152" height="14" fill="#fff"/>
    <text x="110" y="252" font-size="13" fill="#263851">Интервалы, секунды</text>
    <g font-size="14" fill="#263851">
      <text x="110" y="282">Проверять каждые</text><text x="433" y="282">Ждать подключения</text>
      <text x="110" y="324">Пауза после ошибки</text><text x="433" y="324">Максимальная пауза</text>
    </g>
    <g fill="#fff" stroke="#becce0">
      <rect x="345" y="263" width="61" height="28" rx="4"/><rect x="690" y="263" width="61" height="28" rx="4"/>
      <rect x="345" y="305" width="61" height="28" rx="4"/><rect x="690" y="305" width="61" height="28" rx="4"/>
    </g>
    <g font-size="15" fill="#172a46" text-anchor="middle">
      <text x="375" y="282">2</text><text x="720" y="282">120</text>
      <text x="375" y="324">5</text><text x="720" y="324">60</text>
    </g>
    <rect x="92" y="365" width="269" height="36" rx="5" fill="#1a5da5"/>
    <text x="226" y="388" fill="#fff" font-size="14" text-anchor="middle">Остановить наблюдение</text>
    <rect x="370" y="365" width="197" height="36" rx="5" fill="#f6f8fc" stroke="#d6dfed"/>
    <text x="468" y="388" fill="#7788a0" font-size="14" text-anchor="middle">Подключить</text>
    <rect x="576" y="365" width="196" height="36" rx="5" fill="#f4f7fc" stroke="#c2cfe0"/>
    <text x="674" y="388" fill="#263851" font-size="14" text-anchor="middle">Отключить</text>
    <text x="92" y="455" font-size="13" fill="#445675">Пример с вымышленным VPN-профилем</text>
  </g>
</svg>
